<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tiny Museum{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="logo" href="{{ url_for('gallery') }}">Tiny Museum</a>
    <nav><a href="{{ url_for('surprise') }}">Surprise me</a><a class="pill" href="{{ url_for('add_object') }}">Add object</a></nav>
  </header>
  <main>
    {% for message in get_flashed_messages() %}<div class="flash">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
